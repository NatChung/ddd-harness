    # 留空:SHIPPED 是 `status` 這個欄位的**值**,不是欄位名。
    #       (§1 沒有「訂單狀態」這個詞,所以 `status` 這個欄位對不回任何一個詞 ——
    #        那是這份詞彙表真實的差額,不在這裡硬補。)
    wire_field:
    provenance: 暫定
    provenance_ref: "SPEC.md L40(暫定 [Q27]「先給: 已出貨/收到 就好」,逐字見 L545;暫定語氣未解 → §7-3 L392)"

  - term: 收到
    definition: 訂單狀態之一
    ddd_type: 階段或狀態
    representation: 對外值 RECEIVED
    wire_field:
    provenance: 暫定
    provenance_ref: SPEC.md L41(暫定 [Q27],逐字見 L545;→ §7-3 L392)

  - term: 已成立
    definition: 訂單剛產生時的狀態
    ddd_type: 階段或狀態
    representation: 對外值 PLACED
    wire_field:
    provenance: 本案自決
    provenance_ref: SPEC.md L42;依據 §6 A-3(L372):[Q24]「只會更改狀態」蘊含產生當下就有一個狀態,但他沒給名字

  - term: 退費
    definition: 已收到錢但訂單沒建立起來時,把錢退回去
    ddd_type: 階段或狀態(付款的終態)
    representation:
    # 留空:退費是支付側的動作,§1.2 沒有對外端點或欄位。
    wire_field:
