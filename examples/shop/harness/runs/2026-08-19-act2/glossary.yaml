    ddd_type: Value Object(報表數值)
    representation: 見 §6 A-11(L380):以訂單成立時間、時區 Asia/Taipei 分月;回傳訂單張數、售出雙數、銷售金額三個數
    # 留空:E5(L183)回的是 orderCount / unitsSold / salesAmount **三個**欄位,
    #       沒有一個欄位叫「每月銷量」—— 散文那一格寫的是說明,不是一個欄位名。
