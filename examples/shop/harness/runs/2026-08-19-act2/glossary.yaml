# ─────────────────────────────────────────────────────────────────────────
# 禁用同義詞清單(SPEC.md L47-L57)
# 散文把好幾種講法擠在同一格,這裡逐個講法拆成一列。
# note 逐字裝散文那一列的「為什麼」欄。
banned_synonyms:

  # L51 —— 那一格的「一律改用」寫了兩個東西,分屬兩種範圍,故拆兩列。
  - banned: 「總價」指單一品項不含運費的金額
    use_instead: 品項小計
    note: 需求方 Q6 曾說「單價 x 數量 = 總價」(不含運費),Q26 裁決總價含運費。舊語意仍可能出現在任何人口中

  - banned: 「總價」指全單不含運費的金額
    # 散文指定改用「商品金額合計」,但**那個詞不在 §1 詞彙表裡**,FK 指不到,
    # 故此處留空而不硬指一個最接近的詞(指「總價」會把被禁的舊語意指回禁詞本身)。
    use_instead:
    no_replacement_note: 散文(L51)指定改用「商品金額合計」,但 §1 GLOSSARY(L15-L45)沒有這個詞條 —— 它只出現在禁用同義詞清單的這一格。指得到的替代詞不存在,不是沒有替代概念;要補的是 §1 少一個詞條。
    note: 需求方 Q6 曾說「單價 x 數量 = 總價」(不含運費),Q26 裁決總價含運費。舊語意仍可能出現在任何人口中

  # L52 —— 一格裡四個講法,拆四列。
  - banned: orderTotal
    use_instead: 總價
    note: 實作端最容易各取各的名
  - banned: grandTotal
    use_instead: 總價
    note: 實作端最容易各取各的名
  - banned: finalPrice
    use_instead: 總價
    note: 實作端最容易各取各的名
  - banned: amount(裸用)
    use_instead: 總價
    note: 實作端最容易各取各的名

  # L53
  - banned: 「地址」
    use_instead: 收貨地址
    note: Q2 講「收貨地址」、Q20 講「地址」,Q30 確認是同一個。裸用會讓人以為另有帳單地址

  # L54 —— 兩個講法,拆兩列。
  - banned: 「單」指給上游的那張
    use_instead: 上游下定單
    note: Q23「轉下定給他」、Q28「我再另外開單做」——那是另一個東西
  - banned: 「訂單」指給上游的那張
    use_instead: 上游下定單
    note: Q23「轉下定給他」、Q28「我再另外開單做」——那是另一個東西

  # L55
  - banned: 「鎖」
    use_instead: 庫存鎖定
    note: Q7 只說「鎖起來」,沒說鎖誰

  # L56 —— 沒有替代詞的那一列。
  - banned: 「購物車」
    use_instead:
    no_replacement_note: 本案沒有替代詞:購物車不在 §1 詞彙表裡,因為它指的東西在這次根本不存在 —— [Q19]「不在這裡,會另外開單」被採用,§9 R10(L449)一律禁止購物車相關型別。§7-2(L391)未裁決前不得出現,裁決後可能是新增一個詞而不是改用既有的詞。
    note: Q19 說不在這裡、Q22 又說要留著(§7 矛盾未解),裸用會讓實作者以為要做

  # L57 —— 一格裡兩個角色、兩種改法,拆三列(裸用的「客人」+ 兩個方向的互換)。
  - banned: 「客人」
    use_instead: 客戶
    note: Q1/Q3 說「客人」「客戶」,Q25 說「用戶」——是不是同一個角色他沒說
  - banned: 「用戶」指下單的一方
    use_instead: 客戶
    note: Q1/Q3 說「客人」「客戶」,Q25 說「用戶」——是不是同一個角色他沒說
  - banned: 「客戶」指查詢端的一方
    use_instead: 用戶
    note: Q1/Q3 說「客人」「客戶」,Q25 說「用戶」——是不是同一個角色他沒說
