# glossary.yaml —— 從 spec/SPEC.md §1 GLOSSARY(L9-L57)落檔
#
# wire_field 的填法規則(先講清楚,免得空白被讀成漏填):
#   有填 = §1.2(L79-L205)裡真的出現、而且指的就是這個詞的**欄位名**(識別字),
#          包含容器欄位(`orders` / `items`)—— 同一條規則對兩者一致適用。
#   留空 = 這個詞不上線:界外角色 / 外部系統 / 只活在領域內的東西(庫存、庫存鎖定),
#          或散文那一格對應到的不是「一個欄位名」(型別、狀態值、多欄報表數字)。
#   ⚠️ 留空是事實,不是待補。沒有為了填滿而猜任何欄位名。

glossary_terms:

  - term: 訂單
    definition: 客人付費成功之後產生的一筆購買紀錄
    ddd_type: Aggregate Root
    representation:
    wire_field: orders            # E3 列表容器(L158)
    provenance: Qn
    provenance_ref: SPEC.md L15(來源 [Q3] [Q8],逐字見 L521、L526)

  - term: 訂單品項
    definition: 一張訂單裡的一種鞋及其數量
    ddd_type: Entity(隸屬訂單)
    representation:
    wire_field: items             # E1/E2 的品項陣列(L97、L143)
    provenance: 推導自
    provenance_ref: SPEC.md L16(推導自 [Q16]「可以多雙不同的鞋」,逐字見 L534)

  - term: 鞋子 SKU
    definition: 一款鞋的識別碼
    ddd_type: 識別碼
    representation: 字串
    wire_field: sku               # 名詞對照 L196
    provenance: Qn
    provenance_ref: SPEC.md L17(來源 [Q2],逐字見 L520)

  - term: 訂單識別碼
    definition: 一張訂單的識別碼
    ddd_type: 識別碼
    representation: UUID v4 字串
    wire_field: orderId           # 名詞對照 L203
    provenance: 本案自決
    provenance_ref: SPEC.md L18;依據 §6 A-2「UUID v4,不需集中發號、不外洩銷量」(L371)

  - term: 結帳作業
    definition: 客人「進入結帳」後、訂單尚未產生前的那段作業,持有被鎖住的庫存
    ddd_type: Aggregate Root
    representation:
    # 留空:E1 的回應是結帳作業本身,沒有一個叫「結帳作業」的欄位;
    #       它的識別碼是下一個詞。
    wire_field:
    provenance: 本案自決
    provenance_ref: SPEC.md L19;依據 [Q7] 鎖在進入結帳時建立(L525)+ [Q8] 訂單付費成功後才存在(L526)→ 鎖須有訂單以外的載體;見 §6 A-5(L374)

  - term: 結帳識別碼
    definition: 一次結帳作業的識別碼
    ddd_type: 識別碼
    representation: UUID v4 字串
    wire_field: checkoutId        # E1 回應 L108、E2 請求 L126
    provenance: 本案自決
    provenance_ref: SPEC.md L20;依據 §6 A-2(L371)

  - term: 庫存
    definition: 某一個鞋子 SKU 現有的可售數量
    ddd_type: Aggregate Root
    representation: 非負整數
    # 留空:§1.2 沒有任何端點揭露庫存數字 —— 這個詞不上線。
    wire_field:
    provenance: 推導自
    provenance_ref: SPEC.md L21(推導自 [Q7]「要先有該鞋數量」「要先鎖起來」,逐字見 L525)

  - term: 庫存鎖定
    definition: 結帳期間被保留、不可再賣給別人的數量
    ddd_type: Entity(隸屬庫存)
    representation: 正整數
    # 留空:同上,不上線。
    wire_field:
    provenance: Qn
    provenance_ref: SPEC.md L22(來源 [Q7],逐字見 L525)

  - term: 金額
    definition: 這個系統裡所有的錢
    ddd_type: Value Object
    representation: 幣別固定 TWD;整數,單位為「元」,不含小數;不可為負;相等性 = 幣別相同且數值相同
    # 留空:「金額」是型別,不是欄位 —— 上線的是它的每一個用處(unitPrice / lineSubtotal /
    #       shippingFee / totalAmount),各自有自己的詞。
    wire_field:
    provenance: Qn
    provenance_ref: SPEC.md L23:幣別來源 [Q12](逐字見 L530);整數與非負為 本案自決 §6 A-1(L370)

  - term: 單價
    definition: 一雙鞋的價錢
    ddd_type: Value Object(金額)
    representation: TWD 整數
    wire_field: unitPrice         # 名詞對照 L198
    provenance: Qn
    provenance_ref: SPEC.md L24(來源 [Q2],逐字見 L520)

  - term: 數量
    definition: 同一款鞋買幾雙
    ddd_type: Value Object
    representation: 正整數,最小 1
    wire_field: quantity          # 名詞對照 L197
    provenance: Qn
    provenance_ref: SPEC.md L25(來源 [Q2],L520);下限 ≥ 1 為 本案自決 §6 A-6(L375)

  - term: 品項小計
    definition: 一個訂單品項的單價 × 數量
    ddd_type: Value Object(金額)
    representation: TWD 整數
    wire_field: lineSubtotal      # 名詞對照 L199
    provenance: 推導自
    provenance_ref: SPEC.md L26(推導自 [Q21] 公式裡的被加項,逐字見 L539)

  - term: 運費
    definition: 這張單的運送費用
    ddd_type: Value Object(金額)
    representation: TWD 整數
    wire_field: shippingFee       # 名詞對照 L200
    provenance: Qn
    provenance_ref: SPEC.md L27(來源 [Q2] [Q21],逐字見 L520、L539)

  - term: 總價
    definition: 所有品項小計加總,再加上運費
    ddd_type: Value Object(金額)
    representation: TWD 整數
    wire_field: totalAmount       # 名詞對照 L201
    provenance: Qn
    provenance_ref: SPEC.md L28(來源 [Q21] [Q26];[Q26]「最後一個」裁決了 §7-1,逐字見 L539、L544)

  - term: 收貨地址
    definition: 貨要送到哪裡
    ddd_type: Value Object
    representation: 單一字串
    wire_field: shippingAddress   # E1 請求 L95;禁用同義詞清單 L53 明寫此欄位名
    provenance: Qn
    provenance_ref: SPEC.md L29(來源 [Q2] [Q30];[Q30] 確認「地址」與「收貨地址」是同一個,逐字見 L548)

  - term: 客戶基本資訊
    definition: 名字 + email + 收貨地址
    ddd_type: Value Object
    representation:
    # `customer` 給這個詞,不給下面的角色「客戶」:名詞對照 L195 那一列寫的是
    # 「客人 / 客戶 → customer(name / email / shippingAddress)」,而括號裡那三欄
    # 逐字就是本詞的定義。角色「客戶」在 API 上沒有識別碼(見該詞)。
    # wire_field 是 UNIQUE,兩個詞不能同時宣稱 `customer` —— 這裡是刻意的選邊,不是漏填。
    wire_field: customer
    provenance: Qn
    provenance_ref: SPEC.md L30(來源 [Q20] [Q30],逐字見 L538、L548)

  - term: 名字
    definition: 客戶的姓名
    ddd_type: Value Object
    representation: 字串
    wire_field: name              # E1 請求 customer.name(L93)
    provenance: Qn
    provenance_ref: SPEC.md L31(來源 [Q20],逐字見 L538)

  - term: email
    definition: 客戶的電子郵件
    ddd_type: Value Object
    representation: 字串
    wire_field: email             # E1 請求 customer.email(L94)
    provenance: Qn
    provenance_ref: SPEC.md L32(來源 [Q20],逐字見 L538)

  - term: 客戶
    definition: 買鞋的人
    ddd_type: 角色
    representation:
    # 留空:本案沒有客戶識別碼 —— 「誰是誰」是阻斷級規格沉默 B-2(L350),
    #       §10 明寫不得實作任何使用者身分模型(L509)。角色本身不上線,
    #       上線的是他的基本資訊(上面那個詞)。
    wire_field:
    provenance: Qn
    provenance_ref: SPEC.md L33(來源 [Q1] [Q3],逐字見 L519、L521)

  - term: 用戶
    definition: 會去看訂單資料的一種人
    ddd_type: 角色
    representation:
    # 留空:同上,依附 B-2 / B-9(L350、L357);G15 在 B-2 解決前不得實作(L282)。
    wire_field:
    provenance: Qn
    provenance_ref: SPEC.md L34(來源 [Q25],逐字見 L543)

  - term: 後台人員
    definition: 會去看訂單資料的另一種人,看得到所有訂單
    ddd_type: 角色
    representation:
    wire_field:
    provenance: Qn
    provenance_ref: SPEC.md L35(來源 [Q25];「所有」來自需求方第一句原話,逐字見 L543)

  - term: 上游公司
    definition: 實際出貨的那一方
    ddd_type: 角色(外部)
    representation:
    # 留空:界外,本次不實作(§5 L341)。
    wire_field:
    provenance: Qn
    provenance_ref: SPEC.md L36(來源 [Q23],逐字見 L541)

  - term: 第三方支付
    definition: 收錢與退錢的外部系統
    ddd_type: 外部規則集
    representation:
    # 留空:外部系統,以 port 隔離,領域層不得認識任何廠商(§9 R7,L446)。
    wire_field:
    provenance: Qn
    provenance_ref: SPEC.md L37(來源 [Q15] [Q18],逐字見 L533、L536)

  - term: 付費成功
    definition: 第三方支付回報這筆錢收到了
    ddd_type: 階段或狀態
    representation:
    # 留空:§1.2 沒有一個叫「付費成功」的欄位 —— 它在 wire 上只以
    #       E2 的 paymentId 與錯誤碼 402 PAYMENT_NOT_SUCCEEDED(L151)的有無表現。
    wire_field:
    provenance: Qn
    provenance_ref: SPEC.md L38(來源 [Q2] [Q8],逐字見 L520、L526)

  - term: 可出貨
    definition: 訂單成立後,原本被鎖住的庫存轉成的狀態
    ddd_type: 階段或狀態
    representation:
    # 留空:庫存側的狀態,§1.2 不揭露。
    wire_field:
    provenance: Qn
    provenance_ref: SPEC.md L39(來源 [Q17],逐字見 L535)

  - term: 已出貨
    definition: 訂單狀態之一
    ddd_type: 階段或狀態
