      StockReservationReleased 事件驅動(§4 L320),結帳作業只負責到期這件事本身。
      殘留風險:逾時要靠一個排程或計時器去觸發,而**誰來跑、多久掃一次規格沒有寫** ——
      實際釋放的時間會晚於 expiresAt 一段不確定的長度,那段時間裡這條不成立(對外後果是
