# 由 harness 提供,實作者不需要修改這個檔案。
#
# ⚠️ 受測品(ADR 0006 §6),而且**它本身就是洩題面** —— 這幾行等於替實作者決定了
#    「H2 + JPA 的持久化做法」,而這份規格沒有授權過任何技術選型
#    (input-SPEC.md L202:「沒有任何被授權為架構模板的文件」)。
#    這是骨架帶進來的先驗,不是規格帶進來的。
spring.datasource.url=jdbc:h2:mem:shop;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# 這份骨架**沒有 data.sql**。凍結骨架那份建了一張 customers 表(C-001 = Alice),
# 那是凍結那份規格的道具 —— 它的列表要顯示 customerName。
# 這份規格的 list_fields 是 orderId / customerId / items / currency / placedAt /
# status / totalCents,**沒有 customerName**;訂單只保存客人編號(input-SPEC.md L223)。
# 留著等於給一條指向「讀取側 join 姓名」的假線索,而這份規格根本沒有那個需求。
