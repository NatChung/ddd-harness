# 合成(不是任何一份真實 run 的產出):凍結合約的 11 個欄位每個都有一個詞宣告對譯。
# 真實語料裡沒有一份對得到 0 差額 —— 這個 case 只證明「全對得到」那條路真的會回 0。
glossary_terms:
  - term: 詞1
    definition: 對應欄位 orderId 的那個概念
    ddd_type: Value Object
    wire_field: orderId
    provenance: Qn
    provenance_ref: "[Q1]"

